apiVersion: v1
kind: ServiceAccount
metadata:
  name: ml-optimizer-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ml-optimizer-role
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ml-optimizer-binding
subjects:
  - kind: ServiceAccount
    name: ml-optimizer-sa
    namespace: default
roleRef:
  kind: ClusterRole
  name: ml-optimizer-role
  apiGroup: rbac.authorization.k8s.io
