name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v3

      - name: Configuration Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Installation des dependances
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov flake8

      - name: Verification qualite du code (lint)
        run: flake8 api/ optimizer/ config/ collector/ --max-line-length=120 --exit-zero

      - name: Execution des tests unitaires
        run: pytest tests/ -v --cov=optimizer --cov=api
